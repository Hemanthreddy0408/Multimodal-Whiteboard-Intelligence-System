version: "3.9"

services:
  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: whiteboard-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - uploads_data:/app/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - whiteboard-net
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/whiteboard_ai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

  # ─── Celery Worker (Background AI Tasks) ──────────────────────────────────
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: whiteboard-celery
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
      - uploads_data:/app/uploads
      - model_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - postgres
    networks:
      - whiteboard-net
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/whiteboard_ai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: whiteboard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - whiteboard-net

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: whiteboard-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whiteboard_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - whiteboard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Queue + Cache) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - whiteboard-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Qdrant (Vector Database) ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: whiteboard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - whiteboard-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Flower (Celery Monitoring UI) ─────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: whiteboard-flower
    restart: unless-stopped
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - whiteboard-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  model_cache:   # Persists HuggingFace model downloads (~5GB)

networks:
  whiteboard-net:
    driver: bridge
